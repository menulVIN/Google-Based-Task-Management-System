  - Call done() FIRST in both handlers. It puts `disabled` back the way it
    found it, so anything the handler sets afterwards (Import staying off once
    the rows are written) is not undone by it.
  - Pass a container to lock its other buttons too — a card's Start, Pause
    and Done must not all fire at once.
  - done() is safe to call twice.
-->
<style>
  button.is-loading,
  button.is-loading:disabled {
    position: relative;
    color: transparent !important;   /* the label keeps its width, so nothing jumps */
    cursor: progress !important;
    opacity: 1 !important;           /* busy is not the same as unavailable */
    pointer-events: none;
  }
  button.is-loading > * { visibility: hidden; }
  /* Positioned from the centre with a fixed size and a negative margin rather
     than inset:0 + margin:auto — if a size ever fails to apply, inset:0
     stretches the ring across the whole button's container. */
  button.is-loading::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border: 2px solid var(--loader-ink, currentColor);
    border-right-color: transparent;
    border-radius: 50%;
    animation: loader-spin .7s linear infinite;
  }
  @keyframes loader-spin { to { transform: rotate(360deg); } }
</style>
<script>
/**
 * Puts a button into its loading state and returns the function that ends it,
 * or null when that button is already loading.
 */
function withLoader(btn, container) {
  if (!btn || btn.getAttribute('aria-busy') === 'true') return null;

  var locked = [btn];
  if (container) {
    Array.prototype.forEach.call(container.querySelectorAll('button'), function (b) {
      if (b !== btn) locked.push(b);
    });
  }
  var was = locked.map(function (b) { return b.disabled; });

  // The ring is drawn in the button's own text colour, read before the label
  // goes transparent — white on the green buttons, green on the quiet ones.
  btn.style.setProperty('--loader-ink', getComputedStyle(btn).color);
  btn.setAttribute('aria-busy', 'true');
  btn.classList.add('is-loading');
  locked.forEach(function (b) { b.disabled = true; });

  var ended = false;
  return function done() {
    if (ended) return;
    ended = true;
    btn.removeAttribute('aria-busy');
    btn.classList.remove('is-loading');
    btn.style.removeProperty('--loader-ink');
    locked.forEach(function (b, i) { b.disabled = was[i]; });
  };
}
</script>

<script>
/**
 * Show our own failures on the page.
 *
 * Apps Script swallows a script error into a jserror beacon that only Google
 * reads — the page just sits there half-drawn while the network tab fills with
 * MemoryErrorSender posts. This puts the message where the person who hit it
 * can actually read it, and where it can be screenshotted.
 */
(function () {
  var shown = 0;

  function report(what, detail) {
    if (shown >= 3) return;              // one broken frame should not paper the page
    shown++;
    var bar = document.createElement('div');
    bar.setAttribute('role', 'alert');
    bar.style.cssText =
      'margin:10px;padding:11px 13px;border-radius:6px;font:12px/1.5 ' +
      '-apple-system,Segoe UI,Arial,sans-serif;background:#FBECEA;color:#B3261E;' +
      'border:1px solid #B3261E;border-left:3px solid #B3261E;white-space:pre-wrap;' +
      'overflow-wrap:anywhere';
    bar.textContent = 'Dashboard error — send this to Venul\n' + what + '\n' + detail;
    (document.body || document.documentElement).insertBefore(
      bar, (document.body || document.documentElement).firstChild);
  }

  window.addEventListener('error', function (e) {
    report(e.message || 'Script error',
           (e.filename || 'inline') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
  });

  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    report('Unhandled promise rejection', (r && (r.message || r)) || 'no detail');
  });
})();

var allTasks = [], isManager = false, selected = {}, liveTimer = null;
var omittedOld = 0, page = 1, perPage = 10, filtered = [];
var focusId = null, focusThread = null, draftDirty = false;

function el(id) { return document.getElementById(id); }
function node(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent everywhere — a summary
  return n;                                  // containing " or < must not break the card
}

/* FE standard: DD/MM/YYYY throughout. */
function pad2(n) { return String(n).padStart(2, '0'); }
function ddmmyyyy(d) { return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); }

/* Apps Script does not reliably preserve null across google.script.run — a null
   can arrive as undefined, so test for a real number rather than === null. */
function isNum(v) { return typeof v === 'number' && isFinite(v); }

function dur(h) {
  if (h < 1)  return Math.max(1, Math.round(h * 60)) + 'm';
  if (h < 24) return Math.floor(h) + 'h';
  var d = Math.floor(h / 24), r = Math.floor(h % 24);
  return r ? d + 'd ' + r + 'h' : d + 'd';
}
function hhmm(h) {
  if (!h || h <= 0) return '—';
  return Math.floor(h) + 'h ' + Math.round((h % 1) * 60) + 'm';
}

var firstLoad = true;

/* 1e loading state: a skeleton on the very first paint, a quiet overlay after,

function showSkeleton() {
  var s = el('skeleton');
  s.innerHTML = '';
  for (var i = 0; i < 6; i++) {
    var c = node('div', 'sk-card');
    c.appendChild(node('div', 'sk-line')).style.width = '34%';
    c.appendChild(node('div', 'sk-line')).style.width = '86%';
    c.appendChild(node('div', 'sk-line')).style.width = '62%';
    s.appendChild(c);
  }
  s.hidden = false;
  el('grid').hidden = true;
}
function hideSkeleton() { el('skeleton').hidden = true; el('grid').hidden = false; }

/**
 * A refresh clicked while one is already running does nothing. Refreshes that
 * start on their own — after a status change or a post — can still overlap a
 * clicked one, so only the newest request is allowed to paint the board:
 * otherwise a slow older reply lands last and shows data from before the write.

var loadSeq = 0;
function loadTasks(btn) {
  var done = btn ? withLoader(btn) : function () {};
  if (!done) return;

  google.script.run
    .withSuccessHandler(function (res) {
      done();
      if (mine !== loadSeq) return;
      onLoaded(res);

      done();
      if (mine !== loadSeq) return;
      hideOverlay(); hideSkeleton(); firstLoad = false;
      toast('Could not load tasks: ' + e.message, 'bad');
    })
    .getSidebarTasks({ includeFinished: el('include-finished').checked });
}

function onLoaded(res) {
  allTasks   = res.tasks || [];
  isManager  = !!res.isManager;
  omittedOld = res.omittedOld || 0;

  if (window.BRAND && window.BRAND['onesapro-icon']) {
    var m = el('brand-mark');
    m.src = window.BRAND['onesapro-icon'];   // inlined; a relative path is dead under Apps Script
    m.hidden = false;
  }

  el('who').textContent = (res.devName || res.email || '') +
    (isManager ? ' · manager view' : '') + ' · ' + ddmmyyyy(new Date());

  if (res.webAppUrl) {
    el('open-full').href = res.webAppUrl + '?page=mytasks';
    el('open-full').hidden = false;
    el('btn-new').href = res.webAppUrl + '?page=submit';
  }
  el('btn-bulk').hidden = !isManager;
  el('btn-bulk').onclick = function () {
    toast('Bulk add lives in the sheet: Tracker Options → Bulk Add Tasks', 'ok');
  };

  if (isManager) {
    var f = el('filter-developer');
    if (f.options.length <= 1) {
      (res.devNames || []).forEach(function (n) {
        var o = document.createElement('option'); o.value = n; o.textContent = n; f.appendChild(o);
      });
    }
    el('dev-field').hidden = false;
    // The saved assignee can only be applied once the list exists.
    if (pendingDev) {
      if (Array.prototype.some.call(f.options, function (o) { return o.value === pendingDev; })) {
        f.value = pendingDev;
      }
      pendingDev = null;
    }
  }

  updateStats();
  page = 1;
  applyFilters();
  hideOverlay();
  hideSkeleton();
  firstLoad = false;
  startTicker();
  if (focusId) renderFocus();     // keep the focus panel open across a refresh
}

function updateStats() {
  function n(fn) { return allTasks.filter(fn).length; }
  el('count-all').textContent        = n(function (t) { return t.status !== 'Done'; });
  el('count-inprogress').textContent = n(function (t) { return t.status === 'In Progress'; });
  el('count-paused').textContent     = n(function (t) { return t.status === 'Paused'; });
  el('count-overdue').textContent    = n(function (t) { return t.isOverdue; });
}

// -------------------------------------------------------------------- filter
function applyFilters() {
  var q      = el('search').value.toLowerCase();
  var status = el('filter-status').value;
  var dev    = el('filter-developer').value;

  filtered = allTasks.filter(function (t) {
    if (q && t.summary.toLowerCase().indexOf(q) === -1 &&
             t.client.toLowerCase().indexOf(q)  === -1 &&
             t.taskId.toLowerCase().indexOf(q)  === -1) return false;
    if (status === 'overdue') { if (!t.isOverdue) return false; }
    else if (status && status !== 'all' && t.status !== status) return false;
    if (dev && dev !== 'all' && t.assignedMember !== dev) return false;
    return true;
  });

  if ((page - 1) * perPage >= filtered.length) page = 1;
  renderRunning();
  renderNotice();
  renderGrid();
  renderPager();
}

function filterByStatus(s) {
  el('filter-status').value = s;
  ['all', 'inprogress', 'paused', 'overdue'].forEach(function (k) {
    el('stat-' + k).classList.remove('active');
  });
  var map = { all: 'all', 'In Progress': 'inprogress', Paused: 'paused', overdue: 'overdue' };
  if (map[s]) el('stat-' + map[s]).classList.add('active');
  page = 1;
  applyFilters();
}

// ------------------------------------------------------------ running banner
function renderRunning() {
  var slot = el('running-slot');
  slot.innerHTML = '';
  var run = allTasks.filter(function (t) { return t.isLive; })[0];
  if (!run) return;

  var wrap = node('div', 'running-wrap');
  var box  = node('div', 'running');
  var row  = node('div', 'running-row');

  var main = node('div', 'running-main');
  var eye  = node('div', 'running-eyebrow');
  eye.appendChild(node('span', 'pulse'));
  eye.appendChild(document.createTextNode('Now running'));
  main.appendChild(eye);
  main.appendChild(node('div', 'running-title', run.summary));
  main.appendChild(node('div', 'running-meta',
    run.taskId + ' · ' + run.client + (run.module ? ' · ' + run.module : '') +
    ' · ' + run.assignedMember + (run.deadlineStr ? ' · due ' + run.deadlineStr : '')));

  var clock = node('div', 'running-clock');
  var t = node('div', 't', hhmm(run.timeSpentHrs));
  t.dataset.base = run.timeSpentHrs;
  t.dataset.live = '1';
  clock.appendChild(t);
  clock.appendChild(node('div', 's', 'running now'));

  var acts = node('div', 'running-actions');
  var open = node('button', 'btn-pill-quiet', 'Open');
  open.onclick = function () { openFocus(run.taskId); };
  var pause = node('button', 'btn-pill-quiet', 'Pause');
  pause.onclick = function () { setStatus(run.taskId, 'Paused', pause); };
  var done = node('button', 'btn-pill-primary', 'Mark Done');
  done.onclick = function () { setStatus(run.taskId, 'Done', done); };
  acts.appendChild(open); acts.appendChild(pause); acts.appendChild(done);

  row.appendChild(main); row.appendChild(clock); row.appendChild(acts);
  box.appendChild(row);

  if (run.needsCheckIn) box.appendChild(checkInBox(run, 'checkin'));

  wrap.appendChild(box);
  slot.appendChild(wrap);
}

/* The nudge only appears because the Comments tab gives a real idle signal —
   the newest of the last note or the moment the timer started. */
function checkInBox(t, cls) {
  var b = node('div', cls);
  b.appendChild(node('p', null,
    'Nothing logged here for ' + dur(t.idleHours) + '. A note keeps this off the follow-up list.'));
  var addNote = node('button', null, 'Add a note');
  addNote.onclick = function () { openFocus(t.taskId, true); };
  var keep = node('button', null, 'Yes, keep running');
  keep.onclick = function () {
    postComment(t.taskId, 'Still working on this.', false, keep, function (ok) {
      if (ok) toast('Noted — timer keeps running', 'ok');
    });
  };
  b.appendChild(addNote); b.appendChild(keep);
  return b;
}

// ------------------------------------------------------ 1d — focus + thread
var threadRequest = 0;

function openFocus(taskId, focusComposer) {
  focusId = taskId;
  focusThread = null;
  draftDirty = false;
  renderFocus(focusComposer);

  // Open two tasks quickly and the first reply can land after the second,
  // painting task A's conversation under task B's heading. Only the newest
  // request is allowed to write.
  var mine = ++threadRequest;
  google.script.run
    .withSuccessHandler(function (r) {
      if (mine !== threadRequest) return;
      focusThread = r.comments || [];
      renderFocus(focusComposer);
    })
    .withFailureHandler(function (e) {
      if (mine !== threadRequest) return;
      focusThread = [];
      renderFocus();
      toast((e && e.message) ? e.message : 'Could not load the conversation', 'bad');
    })
    .getTaskThread(taskId);
}

function closeFocus() {
  if (draftDirty) {
    confirmDialog({
      title: 'Discard changes?',
      body: 'You have an unsent update on ' + focusId + '. Closing loses it.',
      cancel: 'Keep editing',
      confirm: 'Discard changes',
      onConfirm: function () { draftDirty = false; focusId = null; renderFocus(); }
    });
    return;
  }
  focusId = null;
  renderFocus();
}

/**
 * The request itself: what was asked for, the developer's own note, who
 * reported it, and the files attached when it was raised.
 *
 * Attachments are stored as one Drive URL per line, mixed with whatever the
 * submitter typed into the links box, so each line is a link when it looks
 * like one and plain text otherwise. Built with textContent throughout —
 * every value here is somebody's free text.
 */
function detailBlock(t) {
  var rows = [];
  if (t.remarks)    rows.push(['What was asked', t.remarks]);
  if (t.devRemarks) rows.push(['Developer note', t.devRemarks]);
  if (t.reporter)   rows.push(['Reported by', t.reporter]);

  var links = attachmentList(t.attachments);
  if (!rows.length && !links.length) return null;

  var wrap = node('div', 'detail');
  wrap.appendChild(node('div', 'section-label', 'Request'));

  rows.forEach(function (r) {
    var line = node('div', 'detail-row');
    line.appendChild(node('div', 'detail-k', r[0]));
    line.appendChild(node('div', 'detail-v', r[1]));
    wrap.appendChild(line);
  });

  if (links.length) {
    var line2 = node('div', 'detail-row');
    line2.appendChild(node('div', 'detail-k',
      'Attachments (' + links.length + ')'));
    var box = node('div', 'detail-v');
    links.forEach(function (item) {
      if (item.url) {
        var a = document.createElement('a');
        a.className = 'attach';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.title = item.url;
        a.textContent = item.label;
        box.appendChild(a);
      } else {
        box.appendChild(node('span', 'attach plain', item.label));
      }
    });
    line2.appendChild(box);
    wrap.appendChild(line2);
  }
  return wrap;
}

/** One entry per non-empty line; {url,label} when the line is a link. */
function attachmentList(raw) {
  if (!raw) return [];
  return String(raw).split(/[\r\n,]+/)
    .map(function (l) { return l.trim(); })
    .filter(function (l) { return l.length > 0; })
    .map(function (l) {
      if (!/^https?:\/\//i.test(l)) return { url: '', label: l };
      // A Drive URL is unreadable in full; its file id says nothing either.
      var label = /drive\.google\.com|docs\.google\.com/.test(l)
        ? 'Drive file'
        : l.replace(/^https?:\/\//i, '').split('/')[0];
      return { url: l, label: label };
    });
}

function renderFocus(focusComposer) {
  var slot = el('focus-slot');
  slot.innerHTML = '';
  if (!focusId) return;

  var t = allTasks.filter(function (x) { return x.taskId === focusId; })[0];
  if (!t) { focusId = null; return; }

  var wrap = node('div', 'focus-wrap');
  var box  = node('div', 'focus');

  var head = node('div', 'focus-head');
  var eye  = node('div', 'focus-eyebrow');
  if (t.isLive) eye.appendChild(node('span', 'pulse'));
  eye.appendChild(document.createTextNode(t.isLive ? 'Now running' : t.status));
  head.appendChild(eye);
  head.appendChild(node('div', 'focus-title', t.summary));
  head.appendChild(node('div', 'focus-meta',
    t.taskId + ' · ' + t.client + (t.module ? ' · ' + t.module : '') +
    ' · ' + t.assignedMember + (t.deadlineStr ? ' · due ' + t.deadlineStr : '')));

  var row = node('div', 'focus-row');
  var clock = node('div', 'focus-clock');
  var tv = node('div', 't', hhmm(t.timeSpentHrs));
  tv.dataset.base = t.timeSpentHrs;
  tv.dataset.live = t.isLive ? '1' : '0';
  clock.appendChild(tv);
  clock.appendChild(node('div', 's', t.isLive ? 'running now' : 'logged in total'));

  var acts = node('div', 'focus-actions');
  if (t.isLive) {
    var p = node('button', 'btn-on-green', 'Pause');
    p.onclick = function () { setStatus(t.taskId, 'Paused', p); };
    acts.appendChild(p);
  } else if (t.status !== 'Done') {
    var s = node('button', 'btn-on-green', 'Start');
    s.onclick = function () { setStatus(t.taskId, 'In Progress', s); };
    acts.appendChild(s);
  }
  if (t.status !== 'Done') {
    var d = node('button', 'btn-lime', 'Mark Done');
    d.onclick = function () { setStatus(t.taskId, 'Done', d); };
    acts.appendChild(d);
  }
  var close = node('button', 'btn-on-green', 'Close');
  close.onclick = closeFocus;                  // routes through the same isDirty guard
  acts.appendChild(close);

  row.appendChild(clock); row.appendChild(acts);
  head.appendChild(row);
  box.appendChild(head);

  if (t.needsCheckIn) box.appendChild(checkInBox(t, 'checkin-band'));

  var body = node('div', 'focus-body');

  // What the requester actually wrote, and anything they attached. All of this
  // was already on the row and none of it ever reached the board, so a task
  // could only be understood by opening the spreadsheet.
  var details = detailBlock(t);
  if (details) body.appendChild(details);

  body.appendChild(node('div', 'section-label', 'Conversation'));

  if (focusThread === null) {
    body.appendChild(node('div', 'thread-empty', 'Loading the thread…'));
  } else if (!focusThread.length) {
    body.appendChild(node('div', 'thread-empty',
      'No updates yet. The first note here is what the COO sees instead of silence.'));
  } else {
    var thread = node('div', 'thread');
    focusThread.forEach(function (c) {
      var m = node('div', 'msg');
      m.appendChild(node('div', 'avatar', c.initials));
      var main = node('div', 'msg-main');
      var h = node('div', 'msg-head');
      h.appendChild(node('span', 'msg-name', c.name));
      h.appendChild(node('span', 'msg-when', c.when));
      main.appendChild(h);
      main.appendChild(node('div', 'msg-body', c.body));
      m.appendChild(main);
      thread.appendChild(m);
    });
    body.appendChild(thread);
  }

  var comp = node('div', 'composer');
  var ta = document.createElement('textarea');
  ta.rows = 2;
  ta.id = 'composer-input';
  ta.setAttribute('aria-label', 'Add an update');
  ta.placeholder = 'Write an update…';
  ta.oninput = function () { draftDirty = ta.value.trim().length > 0; post.disabled = !draftDirty; };
  comp.appendChild(ta);

  var foot = node('div', 'composer-foot');
  foot.appendChild(node('span', 'composer-note',
    'Posting also logs ' + 15 + ' minutes against this task'));
  var post = node('button', 'btn-post', 'Post update');
  post.disabled = true;
  post.onclick = function () {
    var text = ta.value.trim();
    if (!text) return;
    ta.readOnly = true;                 // what gets posted is what was typed
    var started = postComment(t.taskId, text, true, post, function (ok) {
      ta.readOnly = false;
      if (ok) { ta.value = ''; draftDirty = false; }
      post.disabled = !draftDirty;      // a failed post can be retried as it stands
    });
    if (!started) ta.readOnly = false;
  };
  foot.appendChild(post);
  comp.appendChild(foot);
  body.appendChild(comp);

  box.appendChild(body);
  wrap.appendChild(box);
  slot.appendChild(wrap);

  if (focusComposer) ta.focus();
}

/**
 * Posting shows on the button that was pressed rather than behind a
 * full-screen overlay — it writes one row, and the board should stay readable
 * while it goes. The button's neighbours are locked with it.
 *
 * after(ok) runs once the request settles either way. It runs after the
 * "Posted" toast, so a caller's own message is the one left on screen.
 * Returns false when that button was already posting.
 */
function postComment(taskId, body, logTime, btn, after) {
  var done = withLoader(btn, btn.parentNode);
  if (!done) return false;

  google.script.run
    .withSuccessHandler(function (r) {
      done();
      if (!r || !r.success) {
        toast((r && r.error) || 'Could not post', 'bad');
        if (after) after(false);
        return;
      }
      focusThread = r.thread || focusThread;
      toast(r.loggedMinutes ? 'Posted · ' + r.loggedMinutes + ' minutes logged' : 'Posted', 'ok');
      if (after) after(true);
      loadTasks();
    })
    .withFailureHandler(function (e) {
      done();
      toast((e && e.message) ? e.message : 'Could not post — the server did not respond', 'bad');
      if (after) after(false);
    })
    .addComment(taskId, body, logTime);
  return true;
}

// ------------------------------------------------------- 1e — confirm dialog
function confirmDialog(o) {
  el('dlg-title').textContent = o.title;
  el('dlg-body').textContent  = o.body;
  el('dlg-cancel').textContent  = o.cancel  || 'Cancel';
  el('dlg-confirm').textContent = o.confirm || 'Confirm';
  el('scrim').classList.add('visible');

  el('dlg-cancel').onclick  = function () { el('scrim').classList.remove('visible'); };
  el('dlg-confirm').onclick = function () {
    el('scrim').classList.remove('visible');
    if (o.onConfirm) o.onConfirm();
  };
  el('dlg-confirm').focus();
}

function renderNotice() {
  var slot = el('notice-slot');
  slot.innerHTML = '';
  if (!omittedOld) return;
  slot.appendChild(node('div', 'notice muted',
    omittedOld.toLocaleString() + ' finished or older task(s) hidden. ' +
    'Tick “Include old finished” to load them.'));
}

// ----------------------------------------------------------------- card grid
function renderGrid() {
  var grid = el('grid');
  grid.innerHTML = '';

  // 1e empty state: say what was searched, and offer the way out.
  if (!filtered.length) {
    var q = el('search').value.trim();
    var st = el('filter-status').value;
    var box = node('div', 'empty');
    box.appendChild(node('div', 'empty-title', 'No records found.'));
    box.appendChild(node('div', 'empty-sub',
      q ? 'Nothing matches “' + q + '”' + (st !== 'all' ? ' with Status = ' + st : '') + '.'
        : (st !== 'all' ? 'Nothing with Status = ' + st + '.' : 'There is nothing here yet.')));
    var clear = node('button', null, 'Clear filters');
    clear.onclick = function () {
      el('search').value = '';
      el('filter-status').value = 'all';
      el('filter-developer').value = 'all';
      page = 1;
      applyFilters();
    };
    box.appendChild(clear);
    grid.appendChild(box);
    return;
  }

  var start = (page - 1) * perPage;
  filtered.slice(start, start + perPage).forEach(function (t) {
    var st = t.status.toLowerCase().replace(/\s+/g, '-');
    var card = node('div', 'card st-' + st + (t.isOverdue ? ' overdue' : ''));
    if (selected[t.taskId]) card.classList.add('selected');

    var top = node('div', 'card-top');
    var chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.setAttribute('aria-label', 'Select ' + t.taskId);
    chk.checked = !!selected[t.taskId];
    chk.onchange = function () { toggleSelect(chk.checked, t.taskId, card); };
    var main = node('div', 'card-main');
    var idEl = node('span', 'card-id', t.taskId + ' · ' + t.date);
    idEl.title = 'Click to copy ' + t.taskId;
    idEl.onclick = function () { copyId(t.taskId, idEl); };
    main.appendChild(idEl);
    var sum = node('span', 'card-sum', t.summary);
    sum.title = t.summary;                       // full text on hover when clamped
    main.appendChild(sum);
    var where = node('span', 'card-where', t.client + (t.module ? ' · ' + t.module : ''));
    where.title = 'Client: ' + t.client + (t.module ? '\nModule: ' + t.module : '');
    main.appendChild(where);
    top.appendChild(chk); top.appendChild(main);

    var meta = node('div', 'card-meta');
    meta.appendChild(node('span', 'state st-' + st, t.status));
    if (t.priority) meta.appendChild(node('span', 'pill pill-' + t.priority.toLowerCase(), t.priority));
    if (isManager)  meta.appendChild(node('span', 'pill pill-who', t.assignedMember));

    if (t.deadlineStr) {
      if (t.isOverdue && isNum(t.hoursOvertime)) {
        meta.appendChild(node('span', 'pill pill-dl-over', dur(t.hoursOvertime) + ' over'));
      } else if (isNum(t.hoursRemaining)) {
        meta.appendChild(node('span', 'pill pill-dl-' + (t.hoursRemaining < 4 ? 'soon' : 'ok'),
                              dur(t.hoursRemaining) + ' left'));
      }
    }

    var time = node('span', 'card-time' + (t.isLive ? ' live' : ''), hhmm(t.timeSpentHrs));
    time.dataset.base = t.timeSpentHrs;
    time.dataset.live = t.isLive ? '1' : '0';
    time.title = t.isLive ? 'Running now — total time logged on this task'
                          : 'Total time logged on this task';
    meta.appendChild(time);

    var acts = node('div', 'card-actions');
    acts.appendChild(actBtn('Start', 'go',  t, 'In Progress', t.status === 'In Progress' || t.status === 'Done',
      t.status === 'Done' ? 'Already finished' : t.status === 'In Progress' ? 'Already running'
                          : 'Start the timer and set this to In Progress'));
    acts.appendChild(actBtn('Pause', '',    t, 'Paused',      t.status !== 'In Progress',
      t.status !== 'In Progress' ? 'Only a running task can be paused'
                                 : 'Stop the timer and bank the time so far'));
    acts.appendChild(actBtn('Done',  '',    t, 'Done',        t.status === 'Done',
      t.status === 'Done' ? 'Already finished'
                          : 'Finish it — banks the time and stamps the completion date'));
    var notes = node('button', 'act notes', 'Notes');
    notes.title = 'Open the conversation for ' + t.taskId +
                  ' — posting an update logs 15 minutes against it';
    notes.onclick = function () { openFocus(t.taskId); };
    acts.appendChild(notes);

    card.appendChild(top); card.appendChild(meta); card.appendChild(acts);
    grid.appendChild(card);
  });
}

function actBtn(label, extra, t, status, disabled, why) {
  var b = node('button', 'act ' + extra, label);
  b.disabled = disabled;
  // A disabled control should say why it is disabled, not just look dead.
  if (why) b.title = why;
  if (!disabled) b.onclick = function () { setStatus(t.taskId, status, b); };
  return b;
}

/** Task ids get pasted into chats and commits constantly. One click. */
function copyId(taskId, el) {
  function flash() {
    var was = el.textContent;
    el.textContent = taskId + ' · copied';
    el.classList.add('copied');
    setTimeout(function () { el.textContent = was; el.classList.remove('copied'); }, 1200);
  }
  try {
    navigator.clipboard.writeText(taskId).then(flash, function () { fallback(); });
  } catch (e) { fallback(); }

  function fallback() {
    // Clipboard API is blocked in some embedded frames; select-and-copy still works.
    var ta = document.createElement('textarea');
    ta.value = taskId;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); flash(); }
    catch (err) { toast('Could not copy — the id is ' + taskId, 'bad'); }
    ta.remove();
  }
}

// ---------------------------------------------------------------- pagination
function renderPager() {
  var total = filtered.length;
  var pages = Math.max(1, Math.ceil(total / perPage));
  el('pager').hidden = false;

  var from = total ? (page - 1) * perPage + 1 : 0;
  var to   = Math.min(page * perPage, total);
  el('pager-label').textContent = 'Showing ' + from + '–' + to + ' of ' +
    total.toLocaleString() + ' records' +
    (omittedOld ? ' · ' + omittedOld.toLocaleString() + ' finished hidden' : '');

  var c = el('pager-controls');
  c.innerHTML = '';

  function pgBtn(label, target, opts) {
    var b = node('button', 'pg' + (opts && opts.on ? ' on' : ''), label);
    b.disabled = !!(opts && opts.off);
    if (!b.disabled && !(opts && opts.on)) b.onclick = function () { page = target; applyFilters(); };
    return b;
  }

  c.appendChild(pgBtn('Previous', page - 1, { off: page === 1 }));

  // Windowed page numbers, so 16 pages does not render 16 buttons.
  var nums = [];
  for (var i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  nums.forEach(function (n) {
    if (n === '…') c.appendChild(node('span', 'pg-gap', '…'));
    else c.appendChild(pgBtn(String(n), n, { on: n === page }));
  });

  c.appendChild(pgBtn('Next', page + 1, { off: page >= pages }));

  var sel = node('select', 'per-page');
  sel.setAttribute('aria-label', 'Rows per page');
  [10, 25, 50].forEach(function (n) {
    var o = document.createElement('option');
    o.value = n; o.textContent = n + ' / page';
    if (n === perPage) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function () { perPage = +sel.value; page = 1; applyFilters(); };
  c.appendChild(sel);
}

// -------------------------------------------------------------- status write
/**
 * The work shows on the card, not behind a full-screen overlay — a status
 * change is one cell and should not block the board. A failure stays attached
 * to the card that caused it, with a retry, instead of a toast that vanishes.
 */
function setStatus(taskId, status, btn) {
  var card = btn.closest('.card');

  // Lock the pressed button's neighbours too. On a card that is the card; in
  // the focus panel it is the action row — which used to stay live, so Pause
  // and Mark Done could both be fired while the first was still writing.
  var endLoader = withLoader(btn, card || btn.closest('.focus-actions'));
  if (!endLoader) return;

  if (card) {
    card.classList.add('busy');
    var old = card.querySelector('.card-error');
    if (old) old.remove();
  }

  function done() {
    endLoader();
    if (card) card.classList.remove('busy');
  }

  function fail(reason) {
    done();
    if (!card) { toast(reason, 'bad'); return; }
    var box = node('div', 'card-error');
    box.appendChild(node('span', null, reason));
    var again = node('button', null, 'Retry');
    again.onclick = function () { box.remove(); setStatus(taskId, status, btn); };
    box.appendChild(again);
    card.appendChild(box);
  }

  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.success) { done(); toast(taskId + ' → ' + status, 'ok'); loadTasks(); }
      else fail((r && r.error) || 'The update did not go through.');
    })
    .withFailureHandler(function (e) {
      fail((e && e.message) ? e.message : 'The server did not respond.');
    })
    .updateStatusFromSidebar(taskId, status);
}

// --------------------------------------------------------------------- bulk
function toggleSelect(on, id, card) {
  if (on) { selected[id] = true; card.classList.add('selected'); }
  else { delete selected[id]; card.classList.remove('selected'); }
  var n = Object.keys(selected).length;
  el('bulkbar').classList.toggle('visible', n > 0);
  el('bulk-count').textContent = n + ' selected';
}

function clearSelection() {
  selected = {};
  el('bulkbar').classList.remove('visible');
  renderGrid();
}

function bulkAction(status, btn) {
  var ids = Object.keys(selected);
  if (!ids.length) return;
  var done = withLoader(btn, el('bulkbar'));
  if (!done) return;
  showOverlay('Updating ' + ids.length + ' task(s)…');
  google.script.run
    .withSuccessHandler(function (r) {
      done();
      hideOverlay();
      if (!r || !r.success) { toast((r && r.error) || 'Bulk update failed', 'bad'); return; }
      toast('Updated ' + r.updated + ' → ' + status + (r.failed ? ' · ' + r.failed + ' failed' : ''),
            r.failed ? 'bad' : 'ok');
      selected = {};
      el('bulkbar').classList.remove('visible');
      loadTasks();
    })
    .withFailureHandler(function (e) {
      done();
      hideOverlay();
      toast((e && e.message) ? e.message : 'Bulk update failed — the server did not respond', 'bad');
    })
    .bulkUpdateStatusFromSidebar(ids, status);
}

// ------------------------------------------------------------------- chrome
function startTicker() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(function () {
    document.querySelectorAll('[data-live="1"]').forEach(function (n) {
      var base = parseFloat(n.dataset.base) || 0;
      base += 1 / 120;                      // 30s tick
      n.dataset.base = base;
      n.textContent = hhmm(base);
    });
  }, 30000);
}

function showOverlay(t) { el('overlay-text').textContent = t || 'Working…'; el('overlay').classList.add('visible'); }
function hideOverlay()  { el('overlay').classList.remove('visible'); }

var toastTimer = null;
function toast(msg, kind) {
  var t = el('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, 3500);
}

// ------------------------------------------------------------- ease of use
/**
 * Filters survive a reload. People open this sidebar dozens of times a day, and
 * re-picking "Eshani / Overdue" every single time is the kind of small tax that
 * stops a tool getting used. Wrapped because storage throws in some frames.
 */
var FILTER_KEY = 'tracker_filters_v1';

function saveFilters() {
  try {
    localStorage.setItem(FILTER_KEY, JSON.stringify({
      status: el('filter-status').value,
      dev:    el('filter-developer').value,
      old:    el('include-finished').checked,
      per:    perPage
    }));
  } catch (e) { /* private window — filters simply will not persist */ }
}

function restoreFilters() {
  try {
    var f = JSON.parse(localStorage.getItem(FILTER_KEY) || '{}');
    if (f.status) el('filter-status').value = f.status;
    if (typeof f.old === 'boolean') el('include-finished').checked = f.old;
    if (f.per) perPage = f.per;
    return f.dev || null;          // assignee list is not built until data lands
  } catch (e) { return null; }
}

['filter-status', 'filter-developer', 'include-finished'].forEach(function (id) {
  el(id).addEventListener('change', saveFilters);
});

/**
 * "/" jumps to search. Escape backs out one level at a time — it clears a
 * search before closing anything, so it never destroys more than you expect.
 */
document.addEventListener('keydown', function (e) {
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '');

  if (e.key === '/' && !typing) {
    e.preventDefault();
    el('search').focus();
    el('search').select();
    return;
  }

  if (e.key === 'Escape') {
    if (el('scrim').classList.contains('visible')) { el('dlg-cancel').click(); return; }
    if (typing && e.target.id === 'search' && e.target.value) {
      e.target.value = ''; page = 1; applyFilters(); return;
    }
    if (el('search').value) { el('search').value = ''; page = 1; applyFilters(); return; }
    if (Object.keys(selected).length) { clearSelection(); return; }
    if (focusId) closeFocus();
  }
});

var pendingDev = restoreFilters();
loadTasks();
</script>
