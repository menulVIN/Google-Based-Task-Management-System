<style>
  /* Task dashboard — restrained product UI.
     Colour is reserved for state (overdue, running, priority). Chrome is neutral,
     so the eye lands on what needs attention rather than on the furniture. */
  :root {
    --bg:#F7F8F9; --surface:#FFFFFF; --raised:#FBFCFC;
    --line:#E3E6E9; --line-soft:#EDEFF1;
    --ink:#16191D; --ink-2:#5A626C; --ink-3:#8B939D;
    --accent:#3D7A00; --accent-soft:#F0F6E8;
    --run:#2F7D32; --run-soft:#EAF4EA;
    --hold:#9A6207; --hold-soft:#FBF3E4;
    --shut:#2C5F82; --shut-soft:#EBF2F7;
    --stop:#B3261E; --stop-soft:#FBECEA;
    --halt:#6B4A9E; --halt-soft:#F2EDF9;
    --focus:#1A73E8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { overflow-x:hidden; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Inter var", Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
    font-feature-settings:"cv02","cv03","tnum";
  }
  :focus-visible { outline:2px solid var(--focus); outline-offset:1px; border-radius:3px; }

  /* ---------------------------------------------------------------- header */
  .header {
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:11px 14px; display:flex; justify-content:space-between;
    align-items:center; gap:10px; position:sticky; top:0; z-index:100;
  }
  .header h2 { font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .header .who { font-size:11px; color:var(--ink-3); margin-top:1px; }
  .refresh-btn {
    background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
    width:28px; height:28px; border-radius:6px; cursor:pointer;
    font-size:13px; line-height:1; flex:none;
  }
  .refresh-btn:hover { background:var(--raised); color:var(--ink); border-color:#D3D8DD; }

  /* ----------------------------------------------------------------- stats */
  .stats-bar { display:flex; background:var(--surface); border-bottom:1px solid var(--line); }
  .stat {
    flex:1; min-width:0; padding:9px 4px 8px; text-align:center; cursor:pointer;
    border-right:1px solid var(--line-soft); border-bottom:2px solid transparent;
    transition:background .12s, border-color .12s;
  }
  .stat:last-child { border-right:none; }
  .stat:hover { background:var(--raised); }
  .stat.active { border-bottom-color:var(--accent); background:var(--raised); }
  .stat-num { font-size:16px; font-weight:600; line-height:1.2; letter-spacing:-.02em;
              font-variant-numeric:tabular-nums; color:var(--ink); }
  .stat-num.red { color:var(--stop); } .stat-num.orange { color:var(--hold); }
  .stat-num.green { color:var(--run); }
  .stat-label { font-size:10px; color:var(--ink-3); margin-top:2px; font-weight:500; }

  /* --------------------------------------------------------------- filters */
  .filters { background:var(--surface); padding:9px 12px 11px;
             border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:7px; }
  .filter-row { display:flex; gap:7px; }
  .filters input, .filters select {
    flex:1; min-width:0; padding:7px 9px; border:1px solid var(--line);
    border-radius:6px; font-size:12px; background:var(--surface);
    font-family:inherit; color:var(--ink);
  }
  .filters input::placeholder { color:var(--ink-3); }
  .filters input:focus, .filters select:focus { border-color:var(--focus); outline:none; }

  .filter-foot { display:flex; align-items:center; justify-content:space-between;
                 gap:10px; flex-wrap:wrap; margin-top:1px; }
  .tick { display:flex; align-items:center; gap:6px; font-size:11px;
          color:var(--ink-2); cursor:pointer; user-select:none; }
  .tick input { accent-color:var(--accent); cursor:pointer; margin:0; }
  .open-full { font-size:11px; color:var(--accent); text-decoration:none; font-weight:500;
               white-space:nowrap; }
  .open-full:hover { text-decoration:underline; }
  .notice.muted { background:var(--raised); border-color:var(--line);
                  border-left-color:var(--ink-3); color:var(--ink-2); }

  /* -------------------------------------------------------------- bulk bar */
  .bulk-bar { display:none; background:var(--ink); color:#fff; padding:8px 12px;
              align-items:center; justify-content:space-between; gap:8px;
              position:sticky; top:51px; z-index:99; flex-wrap:wrap; }
  .bulk-bar.visible { display:flex; }
  #bulk-count { font-size:11px; font-weight:500; white-space:nowrap; }
  .bulk-actions { display:flex; gap:5px; flex:1; justify-content:flex-end; }
  .bulk-btn { padding:5px 11px; border:1px solid rgba(255,255,255,.22); border-radius:5px;
              cursor:pointer; font-size:11px; font-weight:500; white-space:nowrap;
              background:rgba(255,255,255,.1); color:#fff; }
  .bulk-btn:hover { background:rgba(255,255,255,.2); }
  .bulk-btn.done { background:#fff; color:var(--ink); border-color:#fff; font-weight:600; }
  .bulk-btn.cancel { background:none; border-color:transparent; color:rgba(255,255,255,.65); }

  /* ----------------------------------------------------------------- list */
  .task-list { padding:10px; display:grid; gap:7px; grid-template-columns:1fr; }
  @media (min-width:780px) {
    .task-list { grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); padding:14px; gap:10px; }
  }
  .no-tasks { display:block; grid-column:1/-1; text-align:center;
              color:var(--ink-3); padding:48px 20px; font-size:13px; }

  /* ----------------------------------------------------------------- card */
  .task-card {
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    overflow:hidden; min-width:0; position:relative;
    transition:border-color .12s, box-shadow .12s;
  }
  .task-card:hover { border-color:#D3D8DD; box-shadow:0 1px 3px rgba(16,24,40,.06); }
  /* State reads as a 3px spine, not a coloured slab. */
  .task-card::before { content:""; position:absolute; left:0; top:0; bottom:0;
                       width:3px; background:var(--line); }
  .task-card.status-new::before         { background:#C3C9D0; }
  .task-card.status-in-progress::before { background:var(--run); }
  .task-card.status-paused::before      { background:var(--hold); }
  .task-card.status-done::before        { background:var(--shut); }
  .task-card.status-blocked::before     { background:var(--halt); }
  .task-card.overdue::before            { background:var(--stop); }
  .task-card.status-done { background:var(--raised); }
  .task-card.status-done .card-summary { color:var(--ink-2); }
  .task-card.selected { border-color:var(--accent); background:var(--accent-soft); }

  .card-top { display:flex; align-items:flex-start; padding:11px 12px 7px 14px; gap:9px; }
  .card-checkbox { margin-top:2px; cursor:pointer; accent-color:var(--accent); flex:none; }
  .card-main { flex:1; min-width:0; }

  /* Built as spans in the JS helper — the display rule has to live here. */
  .card-id, .card-summary, .card-client { display:block; min-width:0; }
  .card-id { font-size:10.5px; color:var(--ink-3); font-weight:500;
             letter-spacing:.02em; margin-bottom:3px; font-variant-numeric:tabular-nums; }
  .card-summary { font-size:13px; font-weight:600; line-height:1.4; letter-spacing:-.006em;
                  overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2;
                  -webkit-box-orient:vertical; overflow:hidden; }
  .card-client { font-size:11.5px; color:var(--ink-2); margin-top:4px;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .card-meta { display:flex; align-items:center; padding:0 12px 9px 14px;
               gap:5px; flex-wrap:wrap; min-width:0; }
  .badge, .chip, .assigned-chip { display:inline-block; white-space:nowrap; }

  /* Status: a dot and a word. No filled pill. */
  .badge { font-size:11px; font-weight:500; color:var(--ink-2); padding:0;
           text-transform:none; letter-spacing:0; display:inline-flex;
           align-items:center; gap:5px; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge-new         { color:var(--ink-3); }
  .badge-in-progress { color:var(--run); font-weight:600; }
  .badge-paused      { color:var(--hold); }
  .badge-done        { color:var(--shut); }
  .badge-blocked     { color:var(--halt); }

  /* Priority: quiet tint, only Critical carries weight. */
  .badge-critical, .badge-high, .badge-medium, .badge-low {
    padding:1.5px 7px; border-radius:4px; font-size:10.5px; font-weight:500;
    display:inline-block; letter-spacing:0;
  }
  .badge-critical::before, .badge-high::before,
  .badge-medium::before, .badge-low::before { display:none; }
  .badge-critical { background:var(--stop-soft); color:var(--stop); font-weight:600; }
  .badge-high     { background:var(--hold-soft); color:var(--hold); }
  .badge-medium   { background:var(--line-soft); color:var(--ink-2); }
  .badge-low      { background:var(--line-soft); color:var(--ink-3); }

  .chip { font-size:10.5px; padding:1.5px 7px; border-radius:4px; font-weight:500; }
  .chip.overdue { background:var(--stop-soft); color:var(--stop); font-weight:600; }
  .chip.urgent  { background:var(--hold-soft); color:var(--hold); }
  .chip.ok      { background:transparent; color:var(--ink-3); padding-left:0; }
  .assigned-chip { font-size:10.5px; color:var(--ink-2); background:var(--line-soft);
                   padding:1.5px 7px; border-radius:4px; }
  .time-chip { font-size:11px; color:var(--ink-3); margin-left:auto;
               font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:6px; }
  .time-chip.live { color:var(--run); font-weight:600; }

  /* -------------------------------------------------------------- actions */
  /* Ghost buttons. One action is primary per state, the rest recede. */
  .card-actions { display:flex; gap:6px; padding:0 12px 11px 14px; }
  .action-btn {
    flex:1 1 0; min-width:0; padding:6px 4px; border-radius:6px; cursor:pointer;
    font-size:11.5px; font-weight:500; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; font-family:inherit;
    background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
    transition:background .12s, border-color .12s, color .12s;
  }
  .action-btn:hover:not(:disabled) { background:var(--raised); border-color:#CBD1D7; color:var(--ink); }
  .action-btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-start:not(:disabled) { color:var(--run);  border-color:#C6DEC7; background:var(--run-soft); font-weight:600; }
  .btn-start:not(:disabled):hover { background:#DCEBDC; border-color:#A9CFAB; }
  .btn-pause:not(:disabled) { color:var(--hold); border-color:#E8D6B0; background:var(--hold-soft); }
  .btn-done:not(:disabled)  { color:var(--shut); border-color:#C2D7E4; background:var(--shut-soft); }

  /* ------------------------------------------------------------- overlays */
  .loading-overlay { display:none; position:fixed; inset:0; background:rgba(247,248,249,.82);
                     z-index:200; justify-content:center; align-items:center;
                     flex-direction:column; gap:11px; }
  .loading-overlay.visible { display:flex; }
  .spinner { width:24px; height:24px; border:2px solid var(--line);
             border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { color:var(--ink-2); font-weight:500; font-size:12px;
                  text-align:center; padding:0 20px; }
  @media (prefers-reduced-motion:reduce) { .spinner { animation-duration:2s; } }

  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
           background:var(--ink); color:#fff; padding:9px 16px; border-radius:7px;
           font-size:12px; z-index:300; opacity:0; transition:opacity .22s;
           pointer-events:none; max-width:88%; text-align:center;
           box-shadow:0 4px 14px rgba(16,24,40,.2); }
  .toast.show { opacity:1; }
  .toast.success { background:var(--run); }
  .toast.error { background:var(--stop); }

  .notice { margin:12px; padding:11px 13px; background:var(--hold-soft);
            border:1px solid #EBD9B4; border-left:3px solid var(--hold);
            border-radius:6px; font-size:12px; color:#7A4E06; line-height:1.5; }
</style>
