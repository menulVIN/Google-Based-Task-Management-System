<style>
  /* My Tasks — direction 1a, dense grid.
     Colour, type, spacing and radii come from Tokens.html (the OneSapro design
     system). Nothing here re-declares a brand value; state colours amber/red
     are the board's documented additions, also carried by Tokens.html. */

  *, *::before, *::after { box-sizing: border-box; }
  /* An explicit `display` in a rule beats the UA's `[hidden] { display:none }`,
     so .skeleton{display:grid} and .pager{display:flex} stayed on screen even
     with the hidden attribute set. This puts the attribute back in charge. */
  [hidden] { display: none !important; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--off-white);
    color: var(--charcoal);
    font-family: var(--font-body);
    font-size: var(--fs-sm);
    line-height: var(--lh-normal);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: var(--radius-sm); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ------------------------------------------------------------- app bar */
  .appbar { display:flex; align-items:center; gap:var(--space-3);
            padding:var(--space-4) var(--space-5); background:var(--white);
            border-bottom:1px solid var(--line-200); flex-wrap:wrap;
            position:sticky; top:0; z-index:60; }
  .appbar img.mark { height:30px; width:auto; flex:none; }
  .appbar-title { flex:1 1 200px; min-width:0; }
  .appbar h1 { margin:0; font:var(--fw-bold) 17px/1.25 var(--font-heading);
               letter-spacing:var(--ls-tight); color:var(--charcoal); }
  .appbar .sub { font-size:11.5px; color:var(--ink-400); margin-top:2px; }

  .btn { border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font-body);
         white-space:nowrap; transition:background .12s, border-color .12s, color .12s; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-quiet { padding:8px 14px; border:1px solid var(--line-200); background:var(--white);
               font:var(--fw-medium) 12.5px var(--font-body); color:var(--ink-600); }
  .btn-quiet:hover:not(:disabled) { border-color:var(--ink-400); color:var(--charcoal); }
  /* One filled primary per surface — the FE standard. */
  .btn-primary { padding:8px 18px; border:1px solid var(--green-primary);
                 background:var(--green-primary); border-radius:var(--radius-pill);
                 font:var(--fw-semibold) 12.5px var(--font-body); color:var(--text-on-green); }
  .btn-primary:hover:not(:disabled) { background:var(--green-primary-700); border-color:var(--green-primary-700); }

  /* --------------------------------------------------------------- stats */
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
           background:var(--white); border-bottom:1px solid var(--line-200); }
  .stat { padding:13px var(--space-5); border-right:1px solid var(--line-100);
          border-bottom:3px solid transparent; cursor:pointer; text-align:left;
          background:none; font-family:inherit; }
  .stat:last-child { border-right:none; }
  .stat:hover { background:var(--green-wash); }
  .stat.active { background:var(--green-wash); }
  /* Both are <span> inside a <button>; without display:block they render as
     "5OPEN" on one line. */
  .stat-n { display:block; font:var(--fw-extrabold) 24px/1.1 var(--font-heading);
            letter-spacing:var(--ls-tight); color:var(--charcoal); }
  .stat-l { display:block; font:var(--fw-semibold) 10.5px var(--font-body);
            letter-spacing:var(--ls-label); text-transform:uppercase;
            color:var(--ink-400); margin-top:4px; }
  .stat.s-open    { border-bottom-color:var(--green-primary); }
  .stat.s-open    .stat-n { color:var(--green-primary); }
  .stat.s-active  { border-bottom-color:var(--green-lime); }
  .stat.s-active  .stat-n { color:var(--green-medium); }
  .stat.s-paused  { border-bottom-color:var(--state-warn); }
  .stat.s-paused  .stat-n { color:var(--state-warn); }
  .stat.s-overdue { border-bottom-color:var(--state-stop); }
  .stat.s-overdue .stat-n { color:var(--state-stop); }

  /* ------------------------------------------------------------- filters */
  .filters { display:flex; align-items:flex-end; gap:var(--space-3);
             padding:13px var(--space-5); background:var(--white);
             border-bottom:1px solid var(--line-200); flex-wrap:wrap; }
  .field { min-width:0; }
  .field.grow { flex:1 1 260px; }
  .field.fixed { flex:0 1 180px; }
  .field label { display:block; font:var(--fw-semibold) 10.5px var(--font-body);
                 letter-spacing:.06em; text-transform:uppercase;
                 color:var(--ink-400); margin-bottom:5px; }
  .field input, .field select { width:100%; padding:9px var(--space-3);
    border:1px solid var(--line-200); border-radius:var(--radius-sm);
    font:13px var(--font-body); color:var(--charcoal); background:var(--white); }
  .field input:focus, .field select:focus { border-color:var(--green-medium); }
  .tick { display:flex; align-items:center; gap:var(--space-2); font:12.5px var(--font-body);
          color:var(--ink-600); white-space:nowrap; padding-bottom:10px; cursor:pointer; }
  .tick input { accent-color:var(--green-medium); margin:0; cursor:pointer; }
  .open-full { margin-left:auto; padding-bottom:10px; font:var(--fw-medium) 12.5px var(--font-body);
               color:var(--green-medium); text-decoration:none; white-space:nowrap; }
  .open-full:hover { color:var(--green-primary); text-decoration:underline; }

  /* ------------------------------------------------------------ bulk bar */
  .bulkbar { display:none; align-items:center; justify-content:space-between;
             gap:var(--space-3); padding:10px var(--space-5);
             background:var(--green-primary); color:var(--text-on-green);
             flex-wrap:wrap; position:sticky; top:0; z-index:55; }
  .bulkbar.visible { display:flex; }
  .bulkbar .count { font:var(--fw-semibold) 12px var(--font-body); }
  .bulk-actions { display:flex; gap:7px; flex-wrap:wrap; }
  .bulk-btn { padding:6px 13px; border:1px solid var(--divider-on-green);
              background:rgba(255,255,255,.12); color:var(--text-on-green);
              border-radius:var(--radius-sm); font:var(--fw-medium) 12px var(--font-body); cursor:pointer; }
  .bulk-btn:hover:not(:disabled) { background:rgba(255,255,255,.22); }
  .bulk-btn:disabled { opacity:.4; cursor:not-allowed; }
  .bulk-btn.go { background:var(--green-lime); border-color:var(--green-lime);
                 color:var(--green-primary-900); font-weight:var(--fw-semibold); }
  .bulk-btn.clear { background:none; border-color:transparent; color:rgba(255,255,255,.75); }

  /* ------------------------------------------------------- running banner */
  .running-wrap { padding:18px var(--space-5) 0; }
  .running { position:relative; background:var(--white); border:1px solid var(--line-200);
             border-radius:var(--radius-lg); padding:16px 18px 16px 22px;
             overflow:hidden; box-shadow:var(--shadow-sm); }
  .running::before { content:""; position:absolute; left:0; top:0; bottom:0;
                     width:4px; background:var(--green-lime); }
  .running-row { display:flex; align-items:flex-start; gap:var(--space-5); flex-wrap:wrap; }
  .running-main { flex:1 1 340px; min-width:0; }
  .running-eyebrow { display:flex; align-items:center; gap:var(--space-2);
    font:var(--fw-semibold) 10.5px var(--font-body); color:var(--green-medium);
    letter-spacing:var(--ls-label); text-transform:uppercase; }
  .pulse { width:7px; height:7px; border-radius:50%; background:var(--green-lime);
           display:inline-block; animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.28} }
  .running-title { font:var(--fw-bold) 17px/1.35 var(--font-heading);
                   letter-spacing:var(--ls-tight); margin-top:8px; text-wrap:pretty; }
  .running-meta { font-size:12.5px; color:var(--ink-600); margin-top:5px; }
  .running-clock { text-align:right; flex:none; }
  .running-clock .t { font:var(--fw-extrabold) 30px/1 var(--font-heading);
                      color:var(--green-primary); letter-spacing:var(--ls-tight); }
  .running-clock .s { font-size:11px; color:var(--ink-400); margin-top:4px; }
  .running-actions { display:flex; gap:var(--space-2); align-self:center; flex:none; }
  .btn-pill-quiet { padding:10px 18px; border:1px solid var(--line-200); background:var(--white);
                    color:var(--ink-600); border-radius:var(--radius-pill);
                    font:var(--fw-medium) 13px var(--font-body); cursor:pointer; }
  .btn-pill-quiet:hover { border-color:var(--ink-400); color:var(--charcoal); }
  .btn-pill-primary { padding:10px 20px; border:1px solid var(--green-primary);
                      background:var(--green-primary); color:var(--text-on-green);
                      border-radius:var(--radius-pill);
                      font:var(--fw-semibold) 13px var(--font-body); cursor:pointer; }
  .btn-pill-primary:hover { background:var(--green-primary-700); }

  .checkin { display:flex; align-items:center; gap:var(--space-3); margin-top:14px;
             padding:11px 14px; background:var(--state-warn-soft);
             border:1px solid var(--state-warn-line); border-left:3px solid var(--state-warn);
             border-radius:var(--radius-md); flex-wrap:wrap; }
  .checkin p { margin:0; font-size:12.5px; color:var(--state-warn-ink); flex:1 1 280px; }
  .checkin button { padding:6px 12px; border:1px solid var(--state-warn-line);
                    background:var(--white); color:var(--state-warn-ink); border-radius:var(--radius-sm);
                    font:var(--fw-medium) 12px var(--font-body); cursor:pointer; }

  /* ---------------------------------------------------------- card grid */
  .grid { padding:16px var(--space-5) 4px; display:grid;
          grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:var(--space-3); }
  .empty { grid-column:1/-1; text-align:center; color:var(--ink-400);
           padding:var(--space-8) var(--space-5); font-size:13.5px; }

  .card { position:relative; background:var(--white); border:1px solid var(--line-200);
          border-radius:var(--radius-md); overflow:hidden; min-width:0;
          transition:border-color .12s, box-shadow .12s; }
  .card:hover { border-color:var(--ink-400); box-shadow:var(--shadow-sm); }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
                  background:var(--line-200); }
  .card.st-new::before           { background:var(--ink-400); }
  .card.st-in-progress::before   { background:var(--green-lime); }
  .card.st-on-hold::before       { background:var(--state-warn); }
  .card.st-awaiting-info::before { background:var(--state-warn); }
  .card.st-paused::before        { background:var(--state-warn); }
  .card.st-done::before          { background:var(--green-medium); }
  .card.st-blocked::before       { background:var(--state-stop); }
  .card.overdue::before        { background:var(--state-stop); }
  .card.st-done { background:var(--green-wash); }
  .card.selected { border-color:var(--green-medium); box-shadow:var(--shadow-sm); }

  .card-top { display:flex; align-items:flex-start; gap:10px; padding:13px 14px 8px 17px; }
  .card-top input[type=checkbox] { margin:3px 0 0; accent-color:var(--green-medium);
                                   flex:none; cursor:pointer; }
  .card-main { flex:1; min-width:0; }
  .card-id  { display:block; font:var(--fw-semibold) 10.5px var(--font-body);
              color:var(--ink-400); letter-spacing:.05em; }
  .card-sum { display:block; font:var(--fw-semibold) 13.5px/1.45 var(--font-body);
              margin-top:4px; text-wrap:pretty; color:var(--charcoal);
              display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
              overflow:hidden; }
  .card-where { display:block; font-size:12px; color:var(--ink-600); margin-top:5px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .card-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap;
               padding:0 14px 10px 17px; }
  .state { display:inline-flex; align-items:center; gap:5px;
           font:var(--fw-semibold) 11.5px var(--font-body); white-space:nowrap; }
  .state::before { content:""; width:6px; height:6px; border-radius:50%;
                   background:currentColor; display:inline-block; }
  .state.st-new           { color:var(--ink-400); }
  .state.st-in-progress   { color:var(--green-medium); }
  .state.st-on-hold       { color:var(--state-warn); }
  .state.st-awaiting-info { color:var(--state-warn); }
  .state.st-paused        { color:var(--state-warn); }
  .state.st-done          { color:var(--green-primary); }
  .state.st-blocked       { color:var(--state-stop); }

  .pill { font:var(--fw-semibold) 10.5px var(--font-body); padding:2px 8px;
          border-radius:var(--radius-pill); white-space:nowrap; }
  .pill-critical { background:var(--state-stop-soft); color:var(--state-stop); }
  .pill-high     { background:var(--state-warn-soft); color:var(--state-warn); }
  .pill-medium   { background:var(--lime-soft);       color:var(--green-primary); }
  .pill-low      { background:var(--line-100);        color:var(--ink-600); }
  .pill-who      { font-weight:var(--fw-regular); font-size:11px;
                   background:var(--line-100); color:var(--ink-600); }
  .pill-dl-over  { background:var(--state-stop-soft); color:var(--state-stop); }
  .pill-dl-soon  { background:var(--state-warn-soft); color:var(--state-warn); }
  .pill-dl-ok    { background:var(--line-100);        color:var(--ink-600); }
  .card-time { margin-left:auto; font:11.5px var(--font-body); color:var(--ink-600); white-space:nowrap; }
  .card-time.live { color:var(--green-medium); font-weight:var(--fw-semibold); }

  .card-actions { display:flex; gap:7px; padding:0 14px 13px 17px; }
  .act { flex:1; padding:7px 4px; border-radius:var(--radius-sm);
         font:var(--fw-medium) 12px var(--font-body); cursor:pointer;
         background:var(--white); border:1px solid var(--line-200); color:var(--ink-600);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act:hover:not(:disabled) { border-color:var(--ink-400); color:var(--charcoal); }
  .act:disabled { opacity:.4; cursor:not-allowed; }
  .act.go:not(:disabled) { background:var(--lime-soft); border-color:var(--lime-line);
                           color:var(--green-primary); font-weight:var(--fw-semibold); }
  .act.notes { flex:none; padding:7px 11px; }

  /* --------------------------------------------- per-card work and errors
     A status change is one cell. Blocking the whole board behind a full-screen
     overlay for that is heavier than the action deserves, so the card itself
     shows the work and the card itself carries any failure. */
  .card.busy { pointer-events:none; }
  .card.busy .card-top, .card.busy .card-meta { opacity:.5; transition:opacity .12s; }
  .act.working { position:relative; color:transparent !important; pointer-events:none; }
  .act.working::after { content:""; position:absolute; inset:0; margin:auto;
    width:12px; height:12px; border:2px solid var(--line-200);
    border-top-color:var(--green-medium); border-radius:50%;
    animation:spin .7s linear infinite; }

  .card-error { display:flex; align-items:flex-start; gap:var(--space-2);
    margin:0 14px 12px 17px; padding:9px 11px; background:var(--state-stop-soft);
    border:1px solid var(--state-stop); border-left:3px solid var(--state-stop);
    border-radius:var(--radius-sm); font-size:11.5px; color:var(--state-stop); }
  .card-error span { flex:1; min-width:0; overflow-wrap:anywhere; }
  .card-error button { flex:none; padding:3px 9px; border:1px solid var(--state-stop);
    background:var(--white); color:var(--state-stop); border-radius:4px;
    font:var(--fw-semibold) 11px var(--font-body); cursor:pointer; }

  /* Task id is click-to-copy; make that discoverable without an icon. */
  .card-id { cursor:pointer; }
  .card-id:hover { color:var(--green-medium); text-decoration:underline; }
  .card-id.copied { color:var(--green-primary); }

  .kbd { display:inline-block; min-width:16px; padding:1px 5px; border-radius:4px;
         border:1px solid var(--line-200); border-bottom-width:2px;
         background:var(--white); font:var(--fw-semibold) 10.5px ui-monospace, Menlo, monospace;
         color:var(--ink-600); text-align:center; }
  .filter-hint { font-size:11px; color:var(--ink-400); white-space:nowrap; }
  @media (max-width:760px) { .filter-hint { display:none; } }

  /* -------------------------------------------------------- pagination */
  .pager { display:flex; align-items:center; justify-content:space-between;
           gap:var(--space-3); padding:16px var(--space-5) 18px; flex-wrap:wrap; }
  .pager-label { font:12.5px var(--font-body); color:var(--ink-400); }
  .pager-controls { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pg { padding:7px 12px; border:1px solid var(--line-200); background:var(--white);
        border-radius:var(--radius-sm); font:var(--fw-medium) 12px var(--font-body);
        color:var(--ink-600); cursor:pointer; }
  .pg:hover:not(:disabled):not(.on) { border-color:var(--ink-400); color:var(--charcoal); }
  .pg.on { border-color:var(--green-primary); background:var(--lime-soft);
           color:var(--green-primary); font-weight:var(--fw-semibold); }
  .pg:disabled { color:var(--ink-disabled); cursor:not-allowed; }
  .pg-gap { font:12px var(--font-body); color:var(--ink-400); padding:0 3px; }
  .per-page { margin-left:var(--space-2); padding:7px 10px; border:1px solid var(--line-200);
              border-radius:var(--radius-sm); font:12px var(--font-body);
              background:var(--white); color:var(--ink-600); }

  /* -------------------------------------------------------- notice / overlay */
  .notice { margin:var(--space-3) var(--space-5); padding:11px 14px;
            background:var(--state-warn-soft); border:1px solid var(--state-warn-line);
            border-left:3px solid var(--state-warn); border-radius:var(--radius-md);
            font-size:12.5px; color:var(--state-warn-ink); }
  .notice.muted { background:var(--green-wash); border-color:var(--line-200);
                  border-left-color:var(--ink-400); color:var(--ink-600); }

  .overlay { display:none; position:fixed; inset:0; background:rgba(248,250,247,.82);
             z-index:200; justify-content:center; align-items:center;
             flex-direction:column; gap:var(--space-3); }
  .overlay.visible { display:flex; }
  .spinner { width:28px; height:28px; border:2px solid var(--line-200);
             border-top-color:var(--green-medium); border-radius:50%;
             animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .overlay-text { color:var(--green-primary); font:var(--fw-semibold) 12.5px var(--font-body);
                  text-align:center; padding:0 var(--space-5); }

  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
           background:var(--charcoal); color:var(--white); padding:10px 18px;
           border-radius:var(--radius-md); font:12.5px var(--font-body); z-index:300;
           opacity:0; transition:opacity .22s; pointer-events:none;
           max-width:88%; text-align:center; box-shadow:var(--shadow-lg); }
  .toast.show { opacity:1; }
  .toast.ok  { background:var(--green-primary); }
  .toast.bad { background:var(--state-stop); }

  /* ============================ 1d — focus panel ============================
     The running task, opened out with its conversation. Reached from the
     running banner, so the grid stays the default view. */
  .focus-wrap { padding:18px var(--space-5) 0; }
  .focus { background:var(--white); border:1px solid var(--line-200);
           border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-md); }

  .focus-head { padding:18px var(--space-5) 16px; background:var(--green-primary);
                color:var(--text-on-green); }
  .focus-eyebrow { display:flex; align-items:center; gap:var(--space-2);
    font:var(--fw-semibold) 10.5px var(--font-body); letter-spacing:var(--ls-label);
    text-transform:uppercase; color:var(--green-lime); }
  .focus-title { font:var(--fw-bold) 21px/1.3 var(--font-heading);
                 letter-spacing:var(--ls-tight); margin-top:10px; text-wrap:pretty; }
  .focus-meta { font:12.5px var(--font-body); color:rgba(255,255,255,.78); margin-top:7px; }
  .focus-row { display:flex; align-items:flex-end; gap:var(--space-4);
               margin-top:16px; flex-wrap:wrap; }
  .focus-clock { flex:1 1 auto; }
  .focus-clock .t { font:var(--fw-extrabold) 34px/1 var(--font-heading);
                    color:var(--green-lime); letter-spacing:var(--ls-tight); }
  .focus-clock .s { font:11.5px var(--font-body); color:rgba(255,255,255,.7); margin-top:4px; }
  .focus-actions { display:flex; gap:var(--space-2); flex-wrap:wrap; }
  .btn-on-green { padding:10px 18px; border:1px solid var(--divider-on-green);
                  background:rgba(255,255,255,.12); color:var(--text-on-green);
                  border-radius:var(--radius-pill); font:var(--fw-medium) 13px var(--font-body);
                  cursor:pointer; }
  .btn-on-green:hover { background:rgba(255,255,255,.22); }
  .btn-lime { padding:10px 20px; border:1px solid var(--green-lime);
              background:var(--green-lime); color:var(--green-primary-900);
              border-radius:var(--radius-pill); font:var(--fw-semibold) 13px var(--font-body);
              cursor:pointer; }
  .btn-lime:hover { filter:brightness(.95); }

  .checkin-band { display:flex; align-items:center; gap:var(--space-3);
    padding:11px var(--space-5); background:var(--state-warn-soft);
    border-bottom:1px solid var(--state-warn-line); flex-wrap:wrap; }
  .checkin-band p { margin:0; font:12.5px var(--font-body); color:var(--state-warn-ink); flex:1 1 260px; }
  .checkin-band button { padding:6px 12px; border:1px solid var(--state-warn-line);
    background:var(--white); color:var(--state-warn-ink); border-radius:var(--radius-sm);
    font:var(--fw-medium) 12px var(--font-body); cursor:pointer; }

  .focus-body { padding:18px var(--space-5) 20px; }
  .section-label { font:var(--fw-semibold) 10.5px var(--font-body); color:var(--ink-400);
                   letter-spacing:var(--ls-label); text-transform:uppercase; }
  .thread { display:flex; flex-direction:column; gap:14px; margin-top:14px; }
