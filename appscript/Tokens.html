/* ===== colors.css ===== */
/* OneSapro — Color tokens
   Official brand palette, confirmed June 2026.
   Green ecosystem for OneSapro; orange reserved for Texonic only. */
:root {
  /* ---- Brand greens (base) ---- */
  --green-primary: #00712D;   /* Primary Green — hero backgrounds, key surfaces */
  --green-lime: #7EC60F;      /* Lime Green — labels, accents, CTA highlights */
  --green-medium: #5FA201;    /* Medium Green — secondary accents, dividers */
  --green-forest: #1D5D4B;    /* Deep Forest — dark dividers, shadow tones */

  /* Lime/green tints & shades (derived, harmonious) */
  --green-primary-700: #005A24;
  --green-primary-900: #00481D;
  --lime-soft: #EAF6D8;       /* pale lime wash for light backgrounds */
  --green-wash: #F0F6F1;      /* faint green-tinted surface */

  /* ---- Neutrals ---- */
  --charcoal: #323232;        /* body text on light */
  --ink-800: #2A2A2A;
  --ink-600: #4A4A4A;
  --ink-400: #8A8E8B;
  --line-200: #E2E7E2;
  --line-100: #EEF1EE;
  --white: #FFFFFF;
  --off-white: #F8FAF7;

  /* ---- Texonic (parent brand only — never mix with OneSapro greens) ---- */
  --texonic-orange: #ED7A1F;

  /* ---- Semantic aliases ---- */
  --color-bg: var(--white);
  --color-bg-muted: var(--off-white);
  --color-surface: var(--white);
  --color-surface-green: var(--green-primary);
  --color-surface-wash: var(--green-wash);

  --text-strong: var(--charcoal);
  --text-body: var(--ink-600);
  --text-muted: var(--ink-400);
  --text-on-green: var(--white);
  --text-accent: var(--green-medium);

  --color-accent: var(--green-lime);
  --color-accent-strong: var(--green-medium);
  --color-primary: var(--green-primary);

  --border-subtle: var(--line-200);
  --border-strong: var(--charcoal);
  --divider-on-green: rgba(126,198,15,0.45);

  --focus-ring: var(--green-lime);
}

/* ===== typography.css ===== */
/* OneSapro — Typography tokens
   Headlines: Montserrat (bold/extrabold). Body: DM Sans.
   Axiforma SemiBold is the wordmark/display face (brand-supplied .otf). */
:root {
  --font-display: "Axiforma", "Montserrat", system-ui, sans-serif; /* big numbers, hero display */
  --font-heading: "Montserrat", system-ui, sans-serif;             /* headlines */
  --font-body: "DM Sans", system-ui, sans-serif;                   /* body, UI */

  /* Weights */
  --fw-regular: 400; /* @kind font */
  --fw-medium: 500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold: 700; /* @kind font */
  --fw-extrabold: 800; /* @kind font */
  --fw-black: 900; /* @kind font */

  /* Type scale (rem, 16px base) */
  --fs-display: 4.5rem;   /* 72px — stat numbers */
  --fs-h1: 3rem;          /* 48px */
  --fs-h2: 2.25rem;       /* 36px */
  --fs-h3: 1.625rem;      /* 26px */
  --fs-h4: 1.25rem;       /* 20px */
  --fs-lead: 1.125rem;    /* 18px */
  --fs-body: 1rem;        /* 16px */
  --fs-sm: 0.875rem;      /* 14px */
  --fs-label: 0.75rem;    /* 12px — uppercase labels */

  /* Line heights */
  --lh-tight: 1.05; /* @kind font */
  --lh-snug: 1.2; /* @kind font */
  --lh-normal: 1.5; /* @kind font */
  --lh-relaxed: 1.65; /* @kind font */

  /* Tracking */
  --ls-tight: -0.02em; /* @kind font */
  --ls-normal: 0; /* @kind font */
  --ls-label: 0.12em; /* @kind font */
}

/* ===== spacing.css ===== */
/* OneSapro — Spacing, radii, shadow, layout tokens */
:root {
  /* Spacing scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  /* Radii — moderate, friendly geometry to echo the rounded wordmark */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  /* Shadows — soft, low-contrast, green-tinted at rest */
  --shadow-sm: 0 1px 2px rgba(29,93,75,0.06), 0 1px 3px rgba(29,93,75,0.08);
  --shadow-md: 0 4px 12px rgba(29,93,75,0.10), 0 2px 4px rgba(29,93,75,0.06);
  --shadow-lg: 0 12px 32px rgba(29,93,75,0.14), 0 4px 8px rgba(29,93,75,0.08);
  --shadow-focus: 0 0 0 3px rgba(126,198,15,0.45);

  /* Layout */
  --container-max: 1200px;
  --content-max: 760px;
}

/* ===== state colours — added by the board, not in the design system ===== */
:root {
  --lime-line: #D3E9AE;
  --state-stop: #B3261E;
  --state-stop-soft: #FBECEA;
  --state-warn: #B26B00;
  --state-warn-line: #EFDFC2;
  --state-warn-soft: #FBF1E0;
}
